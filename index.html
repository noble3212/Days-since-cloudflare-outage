<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Days Since Cloudflare Went Down</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: #e6e6e6;
        text-align: center;
        padding-top: 60px;
        margin: 0;
    }

    h1 {
        color: #ffffff;
        font-size: 36px;
        margin-bottom: 10px;
    }

    .counter {
        font-size: 50px;
        font-weight: bold;
        margin: 20px 0;
        color: #ff3b3b;
        text-shadow: 0 0 10px #ff3b3b, 0 0 20px #ff3b3b;
    }

    .last-update {
        font-size: 16px;
        opacity: 0.7;
        margin-top: 10px;
    }

    .meme {
        margin-top: 40px;
        max-width: 350px;
        width: 80%;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(255, 50, 50, 0.6);
    }
</style>
</head>
<body>

<h1>Days Since Cloudflare Went Down</h1>

<div class="counter" id="daysCounter">0 days 0 hours 0 minutes 0 seconds</div>
<div class="last-update" id="lastUpdate">Last update: --</div>

<img 
    class="meme"
    src="https://noble3212.github.io/Days-since-cloudflare-outage/1321321321312.png"
    alt="Cloudflare meme placeholder"
/>

<script>
// ========== AUTO-DETECT CLOUDFLARE STATUS & LIVE COUNTER ==========

// Outage start time
const lastOutageDate = new Date("2025-12-05T00:47:00");

// Cloudflare Status API
const statusURL = "https://www.cloudflarestatus.com/api/v2/summary.json";

// Dynamic outage date
let dynamicOutageDate = lastOutageDate;

// Check Cloudflare status
async function checkCloudflareStatus() {
    try {
        const response = await fetch(statusURL);
        const data = await response.json();

        const bad = data.components.some(c => c.status !== "operational");

        if (bad) {
            dynamicOutageDate = new Date();
        }
    } catch (err) {
        console.error("Cloudflare status check failed:", err);
    }
}

// Update counter including seconds
function updateCounter() {
    const now = new Date();
    const diffTime = now - dynamicOutageDate;

    const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diffTime % (1000 * 60)) / 1000);

    document.getElementById("daysCounter").textContent = 
        `${days} days ${hours} hours ${minutes} minutes ${seconds} seconds`;

    document.getElementById("lastUpdate").textContent = 
        "Last update: " + now.toLocaleString();
}

// Run immediately
checkCloudflareStatus();
updateCounter();

// Update every second
setInterval(checkCloudflareStatus, 1000 * 60 * 5); // Cloudflare status every 5 min
setInterval(updateCounter, 1000);                  // live counter every second
</script>

</body>
</html>
